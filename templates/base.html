<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Aenyrathia{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="icon" href="/static/favicon.ico" />
    <script src="/static/htmx.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  </head>

  <body class="app-shell">
    <div class="app-shell__inner">
      <header class="site-header">
        <div class="site-header__inner">
          <div class="site-header__brand">
            <a class="site-header__home" href="/" aria-label="Home">
              <svg class="site-header__home-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 3 3 10v11h6v-6h6v6h6V10z" />
              </svg>
              <span class="sr-only">Home</span>
            </a>
            {% block header_brand %}
            {% endblock %}
          </div>
          <div class="site-header__actions">
          {% block header %}
          {% endblock %}
          </div>
        </div>
      </header>
      <main class="site-main container">
      {% block content %}
      {% endblock %}
      </main>
    </div>
  </body>
</html>
