{% extends "base.html" %}

{% block title %}Page not found{% endblock %}

{% block content %}
  <button
    class="sidebar-toggle btn btn--ghost btn--small"
    type="button"
    id="sidebar_toggle"
    aria-controls="sidebar"
    aria-expanded="false"
  >
    Toggle files
  </button>
  <div class="page-grid" id="page_grid">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__header">Index</div>
      {{ file_tree_html | safe }}
    </aside>
    <section class="not-found article--single">
      <h1>Page not found</h1>
      <p>The requested page does not exist.</p>
      <a class="btn btn--primary" href="/">Back to home</a>
    </section>
  </div>
  <script>
    const sidebar = document.getElementById("sidebar");
    const sidebarToggle = document.getElementById("sidebar_toggle");
    const pageGrid = document.getElementById("page_grid");

    function sidebarStartsOpen() {
      return window.matchMedia("(min-width: 901px)").matches;
    }

    function setSidebarExpanded(isOpen) {
      if (!sidebar || !sidebarToggle) return;
      sidebar.classList.toggle("sidebar--open", isOpen);
      sidebar.classList.toggle("sidebar--hidden", !isOpen);
      pageGrid?.classList.toggle("page-grid--sidebar-hidden", !isOpen);
      sidebarToggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
    }

    function toggleSidebar() {
      if (!sidebar || !sidebarToggle) return;
      setSidebarExpanded(sidebarToggle.getAttribute("aria-expanded") !== "true");
    }

    setSidebarExpanded(sidebarStartsOpen());

    if (sidebarToggle) {
      sidebarToggle.addEventListener("click", toggleSidebar);
    }
  </script>
{% endblock %}
